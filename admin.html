<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add New User (Key only)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* (style sama seperti sebelumnya — dipotong di sini untuk ringkas) */
    :root { --primary:#4361ee; --secondary:#3f37c9; --white:#ffffff; --gray:#6c757d; --warning:#f8961e; --success:#4cc9f0; --danger:#f72585; --dark:#212529; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:#f5f7fa;color:#333;line-height:1.6;}
    .container{width:100%;max-width:1200px;margin:0 auto;padding:0 15px;}
    .header{background:var(--white);box-shadow:0 2px 10px rgba(0,0,0,.1);padding:15px 0;position:fixed;top:0;left:0;right:0;z-index:1000;}
    .header .container{display:flex;justify-content:space-between;align-items:center;}
    .header-left{display:flex;align-items:center;gap:15px;}
    .header-title{font-size:1.25rem;font-weight:600;display:flex;align-items:center;gap:10px;}
    .header-actions{display:flex;align-items:center;gap:15px;}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border-radius:6px;font-weight:500;cursor:pointer;transition:all .3s;border:none;background:transparent;}
    .btn-icon{width:36px;height:36px;border-radius:50%;}
    .btn-primary{background:var(--primary);color:var(--white);}
    .btn-primary:hover{background:var(--secondary);}
    .btn-block{width:100%;}
    .sidebar{position:fixed;top:70px;left:0;bottom:0;width:250px;background:var(--white);box-shadow:2px 0 10px rgba(0,0,0,.1);transition:all .3s;z-index:900;}
    .sidebar.active{left:-250px;}
    .main-content{margin-top:70px;margin-left:250px;padding:20px;transition:all .3s;}
    .main-content.full-width{margin-left:0;}
    .card{background:var(--white);border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,.05);padding:20px;margin-bottom:20px;}
    .form-group{margin-bottom:20px;}
    .label{display:block;margin-bottom:8px;font-weight:500;}
    .form-control{width:100%;padding:10px 15px;border:1px solid #ddd;border-radius:6px;font-size:14px;transition:all .3s;}
    .form-control:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(67,97,238,.2);}
    .form-check{display:flex;align-items:center;gap:8px;}
    .form-result{margin-top:15px;padding:10px;border-radius:6px;text-align:center;}
    .form-result.success{background-color:rgba(76,201,240,.2);color:var(--success);}
    .form-result.error{background-color:rgba(247,37,133,.2);color:var(--danger);}
    .maintenance-warning{background-color:var(--warning);color:var(--dark);padding:10px;border-radius:6px;margin-bottom:20px;text-align:center;font-weight:500;}
    @media (max-width:768px){ .sidebar{left:-250px;} .sidebar.active{left:0;} .main-content{margin-left:0;} }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-left">
        <button class="btn btn-icon" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="header-title"><i class="fas fa-key"></i><span>Add New User (Key only)</span></h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-icon"><i class="fas fa-bell"></i></button>
        <div class="user-avatar"><img src="/logo.png" alt="Admin" width="40" height="40" class="rounded-circle"></div>
      </div>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <ul class="sidebar-menu">
      <li class="sidebar-item"><a href="index.html" class="sidebar-link"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
      <li class="sidebar-item"><a href="admin.html" class="sidebar-link active"><i class="fas fa-user-plus"></i><span>Add User</span></a></li>
      <li class="sidebar-item"><a href="dashboard.html" class="sidebar-link"><i class="fas fa-users-cog"></i><span>Manage Users</span></a></li>
      <li class="sidebar-item"><a href="settings.html" class="sidebar-link"><i class="fas fa-cog"></i><span>Settings</span></a></li>
    </ul>
  </aside>

  <main class="main-content" id="mainContent">
    <div class="container">
      <div id="maintenanceWarning" class="maintenance-warning" style="display:none;">
        <i class="fas fa-exclamation-triangle"></i> Site is currently in Maintenance Mode. User additions might be affected.
      </div>

      <div class="card">
        <form id="addUserForm">
          <div class="form-group">
            <label for="username" class="label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username" required>
          </div>

          <!-- GANTI: hapus password, tambahkan field "key" -->
          <div class="form-group">
            <label for="key" class="label">Key</label>
            <input type="text" id="key" class="form-control" placeholder="Enter key (single identifier)" required>
          </div>

          <div class="form-group">
            <label for="validity" class="label">Valid Until</label>
            <input type="datetime-local" id="validity" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="label">Status</label>
            <div class="form-check">
              <input type="checkbox" id="statusCheckbox" class="form-check-input">
              <label for="statusCheckbox" class="form-check-label">Active User</label>
            </div>
          </div>

          <div class="form-group">
            <label class="label">Device Access</label>
            <div class="radio-group">
              <div class="form-check">
                <input type="radio" id="device1" name="access" value="1" class="form-check-input" checked>
                <label for="device1" class="form-check-label">1 Device</label>
              </div>
              <div class="form-check">
                <input type="radio" id="deviceUnlimited" name="access" value="∞" class="form-check-input">
                <label for="deviceUnlimited" class="form-check-label">Unlimited Devices</label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="credit" class="label">Seller's Credit</label>
            <select id="credit" class="form-control" required>
              <option value="10">10 Credits</option>
              <option value="20">20 Credits</option>
              <option value="30">30 Credits</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-user-plus"></i> Add User</button>
          <div id="result" class="form-result"></div>
        </form>
      </div>
    </div>
  </main>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    // Sidebar toggle
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('active');
      mainContent.classList.toggle('full-width');
    });

    // Form handling (key-only)
    const addUserForm = document.getElementById('addUserForm');
    const resultEl = document.getElementById('result');

    addUserForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const key = document.getElementById('key').value.trim(); // <-- ambil key (bukan password)
      const validity = document.getElementById('validity').value;
      const isActive = document.getElementById('statusCheckbox').checked;
      const credit = document.getElementById('credit').value;
      const access = document.querySelector('input[name="access"]:checked').value;
      const status = isActive ? 'active' : 'inactive';

      if (!username || !key || !validity) {
        showResult('Please fill all fields', 'error');
        return;
      }

      // format validity
      const date = new Date(validity);
      const pad = n => n.toString().padStart(2, '0');
      const formattedDate = `${pad(date.getDate())}-${pad(date.getMonth() + 1)}-${date.getFullYear()} ${pad(date.getHours())}:${pad(date.getMinutes())}`;

      // registration time
      const now = new Date();
      const rgtime = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

      // Simpan ke Firebase: menyimpan field 'key' bukan 'password'
      const userRef = ref(db, `userinfo/${username}`);
      set(userRef, {
        username: username,
        key: key,               // <-- disimpan sebagai key
        status: status,
        validity: formattedDate,
        access: access,
        device: 'null',
        rgtime: rgtime,
        credit: credit
      }).then(() => {
        showResult('User added successfully!', 'success');
        addUserForm.reset();
      }).catch((error) => {
        showResult('Error: ' + error.message, 'error');
      });
    });

    function showResult(message, type) {
      resultEl.textContent = message;
      resultEl.className = `form-result ${type}`;
      setTimeout(() => {
        resultEl.textContent = '';
        resultEl.className = 'form-result';
      }, 3000);
    }

    // Maintenance mode watcher
    const maintenanceWarning = document.getElementById('maintenanceWarning');
    const settingsRef = ref(db, 'settings/maintenanceMode');
    onValue(settingsRef, (snapshot) => {
      const inMaintenance = snapshot.val();
      if (inMaintenance) {
        maintenanceWarning.style.display = 'block';
      } else {
        maintenanceWarning.style.display = 'none';
      }
    });
  </script>
</body>
</html>
